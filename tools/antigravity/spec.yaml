schemaVersion: "1"
kind: sandbox
name: antigravity
displayName: Antigravity CLI
description: "Experimental: Google's Antigravity CLI (agy) coding agent"
defaultIncluded: false

sandbox:
  entrypoint: { run: [agy] }
  # agy keeps two trees under ~/.gemini: antigravity-cli/ for the CLI itself
  # (settings, conversations, caches) and config/ for what it shares with the
  # Antigravity IDE (skills, MCP servers, workflows). One store covers both.
  configDir: .gemini
  skillsDir: .gemini/config/skills
  settingsFile: antigravity-settings.json
  settingsTarget: .gemini/antigravity-cli/settings.json
  yoloFlag: --dangerously-skip-permissions
  yoloEnabled: true
  continueArgs: [--continue]
  # Conversations live in SQLite databases opened in WAL mode
  # (conversations/, conversation_summaries.db).
  qemuStoreCacheMmap: true
  statePaths:
    # Runtime data written by agy. The OAuth token is covered separately by
    # providers[].authFiles.
    - antigravity-cli/conversations/
    - antigravity-cli/conversation_summaries.db*
    - antigravity-cli/brain/
    - antigravity-cli/implicit/
    - antigravity-cli/cache/
    - antigravity-cli/log/
    - antigravity-cli/builtin/
    - antigravity-cli/updater/
    - antigravity-cli/jetski_state.pbtxt
    # Workspace-to-project mappings and the migration marker.
    - config/projects/
    - config/.migrated
    # MCP OAuth tokens are credentials, not configuration.
    - mcp_oauth_tokens.json
  # Plugins (config/plugins.json) and the hook configuration (config/hooks.json)
  # are deliberately left out: both execute code the session did not build.
  passthroughPaths:
    - antigravity-cli/keybindings.json
    - antigravity-cli/settings.json
    - config/AGENTS.md
    - config/GEMINI.md
    - config/agents.json
    - config/agents/
    - config/global_workflows/
    - config/mcp_config.json
    - config/rules.json
    - config/rules/
    - config/skills.json
    - config/skills/
    - config/workflows/

environment:
  variables:
    # agy spawns a background self-updater on every start, which would swap the
    # binary the image was built with. The updater host is not in the allowlist
    # either, so this only saves a failed download per session.
    AGY_CLI_DISABLE_AUTO_UPDATE: "true"

network:
  deniedDomains:
    # Clearcut (https://play.googleapis.com/log), the endpoint agy's analytics
    # worker posts to. Denied explicitly because the allowlist has to resolve
    # googleapis.com for the agent backend, and deny out-ranks allow.
    - play.googleapis.com
    # Background self-update downloads. Already unreachable under the deny-all
    # allowlist; denied by policy so widening the allowlist does not re-open it.
    - antigravity-cli-auto-updater-974169037036.us-central1.run.app
  serviceDomains:
    generativelanguage.googleapis.com: gemini-api-key
  serviceAuth:
    # With GOOGLE_GEMINI_BASE_URL set (a proxy such as LiteLLM), the key is
    # released to that host instead of generativelanguage.googleapis.com.
    gemini-api-key:
      headerName: x-goog-api-key
      hostsFromCredential: gemini-base-url

credentials:
  sources:
    gemini-api-key: { env: [GEMINI_API_KEY] }
    # Not a secret: only selects the host the key is released to. apiKey: false
    # keeps it out of the API-key handling, so the URL stays readable in the
    # container, where agy needs it.
    gemini-base-url: { env: [GOOGLE_GEMINI_BASE_URL], apiKey: false }

providers:
  # "gemini" matches agy's modelProvider value; provider names are tool-native.
  # Without an OS keyring agy stores the Antigravity account session in
  # antigravity-cli/antigravity-oauth-token. Declaring it moves the session into
  # the shared auth store so a login carries across projects and --auth-name.
  - name: gemini
    credentials: [gemini-api-key]
    authFiles: [antigravity-cli/antigravity-oauth-token]
