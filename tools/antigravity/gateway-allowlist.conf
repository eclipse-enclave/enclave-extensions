# Enclave DNS allowlist for the Antigravity CLI
no-resolv
no-poll
# Block all domains by default (return NXDOMAIN)
address=/#/

# Antigravity: sign-in landing page, OAuth client metadata, changelog, docs.
# Not covered by the google.conf fragment -- antigravity.google is its own TLD.
server=/antigravity.google/8.8.8.8

# Google: accounts.google.com and oauth2.googleapis.com for sign-in and token
# refresh, cloudcode-pa/aicode.googleapis.com for the agent backend,
# generativelanguage.googleapis.com for GEMINI_API_KEY mode, and
# aiplatform/iamcredentials/sts.googleapis.com for enterprise Agent Platform,
# ADC and workload identity. spec.yaml denies play.googleapis.com out of this
# range; dnsmasq resolves by longest match, so the deny out-ranks it.
conf-file=/etc/dnsmasq.allowlists/fragments/google.conf

# The background self-updater's host (a *.run.app service) is deliberately
# absent, so the binary the image was built with is the binary that runs.

# Common Infrastructure
conf-file=/etc/dnsmasq.allowlists/fragments/github.conf
conf-file=/etc/dnsmasq.allowlists/fragments/npm.conf
conf-file=/etc/dnsmasq.allowlists/fragments/pypi.conf
conf-file=/etc/dnsmasq.allowlists/fragments/go.conf
conf-file=/etc/dnsmasq.allowlists/fragments/rust.conf
conf-file=/etc/dnsmasq.allowlists/fragments/cdn.conf
conf-file=/etc/dnsmasq.allowlists/fragments/tls.conf
