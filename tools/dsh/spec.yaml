schemaVersion: "1"
kind: sandbox
name: dsh
displayName: DeepSeek Harness
description: "Experimental: DeepSeek Harness (dsh) agent with its browser UI"
defaultIncluded: false

sandbox:
  entrypoint: { run: [enclave-dsh-session] }
  configDir: .dsh
  skillsDir: .dsh/skills
  settingsFile: dsh-cordis.patch.yml
  settingsTarget: .dsh/cordis.patch.yml
  yoloEnabled: true

credentials:
  sources:
    deepseek-api-key: { env: [DEEPSEEK_API_KEY] }
    anthropic-api-key: { env: [ANTHROPIC_API_KEY] }
    openai-api-key: { env: [OPENAI_API_KEY] }
    gemini-api-key: { env: [GEMINI_API_KEY] }

network:
  # Redundant today: a serviceDomains host whose service also has a serviceAuth
  # entry is unioned into the allowlist as a credential-release host. Kept
  # deliberately, because that union is silent (dropping a serviceAuth entry
  # de-allows its hosts with no validation error), and unlike the other
  # providers, DeepSeek has no allowlist fragment as a backstop.
  allowedDomains: [api.deepseek.com]
  serviceDomains:
    # dsh's built-in web_search tool shares this host
    # (DEEPSEEK_SEARCH_BASE_URL defaults to https://api.deepseek.com/anthropic/v1).
    api.deepseek.com: deepseek-api-key
    api.anthropic.com: anthropic-api-key
    "*.anthropic.com": anthropic-api-key
    api.openai.com: openai-api-key
    "*.openai.com": openai-api-key
    generativelanguage.googleapis.com: gemini-api-key
  serviceAuth:
    deepseek-api-key: { headerName: authorization, valueFormat: "Bearer %s" }
    anthropic-api-key: { headerName: x-api-key }
    openai-api-key: { headerName: authorization, valueFormat: "Bearer %s" }
    gemini-api-key: { headerName: x-goog-api-key }

providers:
  - name: deepseek
    credentials: [deepseek-api-key]
  - name: anthropic
    credentials: [anthropic-api-key]
  - name: openai
    credentials: [openai-api-key]
  - name: google
    credentials: [gemini-api-key]

ports:
  - container: 3080
    publish: true
    label: DeepSeek Harness
    openUrl: "http://localhost:{host_port}/"
