# Enclave DNS allowlist for Amp
no-resolv
no-poll
# Block all domains by default (return NXDOMAIN)
address=/#/

# Amp: the API and web app (ampcode.com) and the device-login endpoint
# (auth.ampcode.com). dnsmasq matches subdomains, so this also resolves
# static.ampcode.com; spec.yaml denies that host explicitly so `amp update`
# cannot swap the binary the image was built with.
server=/ampcode.com/8.8.8.8

# Amp's WebSocket workers (production.ampworkers.com), which carry live thread
# updates.
server=/ampworkers.com/8.8.8.8

# No model provider hosts: Amp proxies inference through its own backend, so a
# session reaches Anthropic or OpenAI only by way of ampcode.com.

# Common infrastructure. The package registries are for dependencies of the
# projects the coding agent works on; they are not amp runtime dependencies.
conf-file=/etc/dnsmasq.allowlists/fragments/github.conf
conf-file=/etc/dnsmasq.allowlists/fragments/npm.conf
conf-file=/etc/dnsmasq.allowlists/fragments/pypi.conf
conf-file=/etc/dnsmasq.allowlists/fragments/go.conf
conf-file=/etc/dnsmasq.allowlists/fragments/rust.conf
conf-file=/etc/dnsmasq.allowlists/fragments/cdn.conf
conf-file=/etc/dnsmasq.allowlists/fragments/tls.conf
