schemaVersion: "1"
kind: sandbox
name: openclaw
displayName: OpenClaw
description: "Experimental: OpenClaw personal AI assistant (gateway, TUI, and web dashboard)"
defaultIncluded: false

sandbox:
  entrypoint: { run: [enclave-openclaw-session] }
  configDir: .openclaw
  skillsDir: .openclaw/skills
  settingsFile: openclaw-settings.json
  settingsTarget: .openclaw/openclaw.json
  yoloEnabled: true
  qemuStoreCacheMmap: true

ports:
  - container: 18789
    publish: true
    label: OpenClaw Dashboard
    openUrl: "http://localhost:{host_port}/"

credentials:
  sources:
    anthropic-api-key: { env: [ANTHROPIC_API_KEY] }
    openai-api-key: { env: [OPENAI_API_KEY] }
    gemini-api-key: { env: [GEMINI_API_KEY] }

network:
  serviceDomains:
    api.anthropic.com: anthropic-api-key
    "*.anthropic.com": anthropic-api-key
    api.openai.com: openai-api-key
    "*.openai.com": openai-api-key
    generativelanguage.googleapis.com: gemini-api-key
  serviceAuth:
    anthropic-api-key: { headerName: x-api-key }
    openai-api-key: { headerName: authorization, valueFormat: "Bearer %s" }
    gemini-api-key: { headerName: x-goog-api-key }

providers:
  - name: anthropic
    credentials: [anthropic-api-key]
  - name: openai
    credentials: [openai-api-key]
  - name: google
    credentials: [gemini-api-key]
