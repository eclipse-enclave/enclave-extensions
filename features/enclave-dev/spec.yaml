schemaVersion: "1"
kind: mixin
name: enclave-dev
displayName: Enclave Development
description: >-
  Go linters at the versions Enclave's CI pins (golangci-lint, gosec,
  govulncheck), for developing Enclave itself. Needs Go from golang-dev.
defaultEnabled: false
# install.sh needs go, which core's golang-dev feature (priority 45) installs
# in an earlier stage.
priority: 50
failOnInstallError: true
