schemaVersion: "1"
kind: mixin
name: vnc
displayName: VNC
description: >-
  Virtual X display with a contained Chromium browser, served over VNC (RFB).
  Opt-in. The raw RFB port is published so any VNC client can attach.
defaultEnabled: false
needsRoot: true
failOnInstallError: true
priority: 75
aptPackages:
  # Chromium itself is installed by install.sh, not listed here: it is only a
  # real deb on Debian archives (Ubuntu ships a snap stub), and install.sh can
  # name this feature in the error where the shared apt step cannot.
  - tigervnc-standalone-server
  # tigervncpasswd, only a Recommends of the server, which apt skips here.
  - tigervnc-tools
  - matchbox-window-manager
  - xdg-utils
  - fonts-liberation
  - fonts-dejavu-core
commands:
  startup:
    - command: [/usr/local/bin/enclave-vnc-supervisor]
      background: true
      description: VNC stack (Xvnc, window manager, Chromium)
ports:
  - container: 5900
    hostAllocation: auto
    publish: true
    label: VNC (RFB)
    openUrl: "vnc://localhost:{host_port}"
